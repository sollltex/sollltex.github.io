<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FearProject — Подключение</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080A0D;
            color: #F1F0EC;

            font-family: Arial, sans-serif;
        }

        .box {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #A0A5AB;
        }

        a {
            color: #D46A3A;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>FearProject</h1>
    <p id="status">Открываем Steam...</p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const server = params.get("server");

    if (!server) {
        document.getElementById("status").textContent =
            "Сервер не указан.";
    } else {
        const steamUrl = `steam://connect/${server}`;

        window.location.href = steamUrl;

        setTimeout(() => {
            document.getElementById("status").innerHTML =
                `Если Steam не открылся, <a href="${steamUrl}">нажмите сюда</a>.`;
        }, 1500);
    }
</script>

</body>
</html>
